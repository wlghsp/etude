spring:
  jpa:
    hibernate:
      ddl-auto: validate
  # 스키마 초기화는 IntegrationTest의 MariaDBContainer.withInitScript(...)가 컨테이너 시작 시
  # 한 번만 수행한다 — spring.sql.init을 켜두면 여러 @SpringBootTest spec이 각자 컨텍스트를
  # 만들 때마다 스크립트를 재실행하려 시도해 "Table already exists"가 난다.
  sql:
    init:
      mode: never

etude:
  jwt:
    secret: test-secret-must-be-at-least-256-bits-long-for-hmac-sha
    expires-hours: 24