server {
    listen 80 default_server;
    server_name _;

    # Let's Encrypt 갱신용 (webroot). 리다이렉트보다 먼저 매칭된다.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # 도메인/IP 어느 쪽으로 들어와도 도메인의 HTTPS로 보낸다.
    location / {
        return 301 https://etudequest.com$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name etudequest.com;
    root /usr/share/nginx/html;

    # 백엔드 이름을 시작할 때 한 번이 아니라 요청 때마다 풀어서(변수 proxy_pass), 백엔드가 아직 없어도 nginx가 죽지 않고
    # 502만 돌려준다. 백엔드 컨테이너가 다시 만들어져 IP가 바뀌어도 따라간다 (재부팅 시 컨테이너 기동 순서가 임의인 경우 포함).
    # 변수에 URI 를 쓰지 않아서 요청 경로는 그대로(/ws/ 접두사 포함) 백엔드로 전달된다.
    resolver 127.0.0.11 valid=5s ipv6=off;
    set $backend_upstream http://backend:3001;

    ssl_certificate     /etc/letsencrypt/live/etudequest.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/etudequest.com/privkey.pem;

    # WebSocket (백엔드 라우트가 /api 접두사 없이 등록되어 있으므로 먼저 매칭)
    location /ws/ {
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    # 프론트엔드는 SPA 라우터 없이 App.tsx state로만 화면을 전환하므로 실제 경로는 / 하나뿐이다.
    # 정적 파일(js/css/이미지 등)이 존재하면 그대로 서빙하고, 없으면 API 요청으로 간주해 backend로 넘긴다.
    location = / {
        try_files /index.html @backend;
    }

    location / {
        try_files $uri @backend;
    }

    location @backend {
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
