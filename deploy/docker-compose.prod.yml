services:
  db:
    image: mariadb:11
    container_name: etude-db
    restart: unless-stopped
    env_file: ./backend/.env.prod
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: etude
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      # DBeaver 등 로컬 DB 클라이언트에서 SSH 터널로만 접근하도록 localhost에만 바인딩
      - "127.0.0.1:3306:3306"
    volumes:
      - etude-db-data:/var/lib/mysql
      - ./backend/db:/docker-entrypoint-initdb.d
    healthcheck:
      # 접속이 실제로 되는지 본다 (컨테이너 시작과 DB 준비는 다르다)
      test: ["CMD-SHELL", "mariadb-admin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - etude

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: etude-backend
    restart: unless-stopped
    env_file: ./backend/.env.prod
    environment:
      # vcluster CLI가 표준으로 인식하는 KUBECONFIG 환경변수 — KUBECONFIG_PATH(.env.prod)와 동일 경로를 가리킨다
      KUBECONFIG: /root/.kube/config-etude
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${HOME}/.kube/config-etude:/root/.kube/config-etude:ro
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # /health 는 DB까지 확인한다. 시작 직후 고아 정리와 vcluster 풀 생성 시간을 start_period 로 기다린다.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3001/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 180s
    networks:
      - etude
      - k3d-etude

  nginx:
    image: nginx:alpine
    container_name: etude-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/www/certbot:/var/www/certbot:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - ./frontend/dist:/usr/share/nginx/html:ro
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - etude

volumes:
  etude-db-data:

networks:
  etude:
    driver: bridge
  k3d-etude:
    external: true