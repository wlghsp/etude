services:
  db:
    image: mariadb:11
    container_name: etude-db
    restart: unless-stopped
    env_file: ./backend/.env.prod
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: etude
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      # DBeaver 등 로컬 DB 클라이언트에서 SSH 터널로만 접근하도록 localhost에만 바인딩
      - "127.0.0.1:3306:3306"
    volumes:
      - etude-db-data:/var/lib/mysql
      - ./backend-kotlin/apps/backend/src/main/resources/db:/docker-entrypoint-initdb.d
    networks:
      - etude

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: etude-backend
    restart: unless-stopped
    env_file: ./backend/.env.prod
    environment:
      # vcluster CLI가 표준으로 인식하는 KUBECONFIG 환경변수 — KUBECONFIG_PATH(.env.prod)와 동일 경로를 가리킨다
      KUBECONFIG: /root/.kube/config-etude
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${HOME}/.kube/config-etude:/root/.kube/config-etude:ro
    depends_on:
      - db
    networks:
      - etude
      - k3d-etude

  nginx:
    image: nginx:alpine
    container_name: etude-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./frontend/dist:/usr/share/nginx/html:ro
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    networks:
      - etude

volumes:
  etude-db-data:

networks:
  etude:
    driver: bridge
  k3d-etude:
    external: true