name: Deploy

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd ~/etude
            git pull
            docker build -q -f backend/docker/Dockerfile.linux -t etude-linux:latest backend
            docker build -q -f backend/docker/Dockerfile.linux-db -t etude-linux-db:latest backend
            docker build -q -f backend/docker/Dockerfile.k8s -t etude-k8s:latest backend
            docker build -q -f backend/docker/Dockerfile.ssh -t etude-ssh:latest backend
            scripts/migrate.sh
            cd frontend
            npm ci
            npm run build
            cd ..
            docker compose -f deploy/docker-compose.prod.yml --project-directory . up -d --build --wait --wait-timeout 600 backend nginx